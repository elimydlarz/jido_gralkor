[project]
name = "jido_gralkor"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  # No `openai` extra is named: graphiti-core requires `openai` unconditionally
  # (Requires-Dist: openai>=1.91.0), so the OpenAI LLM, embedder, and reranker
  # clients are importable from this manifest alone. Naming a non-existent extra
  # makes uv warn on every resolve.
  "graphiti-core[falkordb,google-genai]==0.31.2",
  "falkordblite",
  # graphiti-core 0.31.2 imports `httpx` without declaring it, and neither
  # openai 3 nor google-genai 3 installs it (both moved to `httpx2`), so
  # google-genai stays below 3 to keep `httpx` installed.
  "google-genai<3"
]
