steps:
  - label: inspect-related-information
    directions: |-
      Inspect every current lensed representation and all related stored
      information supplied to this Reflection. Identify candidate patterns that
      remain useful beyond this completed ingestion. For each candidate, include
      the exact content and level of every stored generalisation that it
      generalises over. Exclude stored generalisations that do not influence the
      candidate.
    output:
      candidates: "Array<{ content: string; generalises_over: Array<{ content: string; level: integer }>; rationale: string }>"

  - label: evaluate-durability
    directions: |-
      Evaluate these candidate patterns for durability and usefulness:

      {{candidates}}

      Select only patterns that are sufficiently supported and durable. Preserve
      the exact preceding generalisations for each assessment and explain the
      selection decision.
    output:
      assessments: "Array<{ content: string; generalises_over: Array<{ content: string; level: integer }>; durable: boolean; reasoning: string }>"

  - label: synthesise-artefact
    directions: |-
      Synthesize the final generalisation artefact from these assessments:

      {{assessments}}

      Include every selected durable generalisation. A generalisation with no
      preceding generalisations has level 1. Otherwise its level is one greater
      than the highest level among the generalisations it generalises over. Do
      not include rejected candidates.
    output:
      generalisations: "Array<{ content: string; level: integer; generalises_over: Array<{ content: string; level: integer }> }>"
