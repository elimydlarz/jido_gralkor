steps:
  - label: inspect-world
    directions: |-
      Inspect every current lensed representation and all related stored
      information supplied to this Reflection. Treat current representations
      and Lens-authored stored episodes as observations. Treat stored artefacts
      declaring the generalisations Reflection as prior generalisations.
      Revisit current and related observations together with prior
      generalisations. Describe how the observations reinforce, qualify,
      conflict with, or connect the prior generalisations, and where they call
      for a new generalisation.
    output:
      inspection: "string"

  - label: evolve-generalisations
    directions: |-
      Evolve the generalisations in light of this inspection:

      {{inspection}}

      Carry forward, combine, broaden, narrow, split, replace, or otherwise
      revise generalisations as observations warrant. Each evolution is one
      current generalisation. Copy `evolves_from` only from the eligible
      prior-generalisation lineage snapshots supplied separately, preserving
      their content and level exactly. When that list is empty, every evolution
      must use an empty `evolves_from`. Exclude eligible prior generalisations
      that do not influence the evolution. When a current representation
      explicitly says it extends an eligible prior generalisation and repeats
      that prior's content, that prior influences the evolution and must be
      copied into `evolves_from`.
    output:
      evolutions: "Array<{ content: string; evolves_from: Array<{ content: string; level: integer }>; reasoning: string }>"
